name: CI

on:
  push:
    branches: [develop]

jobs:
  test-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Backend
        run: |
          cd backend
          npm install
          npm run lint
          npm test

      - name: Frontend
        run: |
          cd frontend
          npm install
          npm run lint
          npx vitest run
          npm run build
